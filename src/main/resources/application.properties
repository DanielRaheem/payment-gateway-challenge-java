server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# Do not silently truncate fractional amounts or expiry components during JSON binding.
spring.jackson.deserialization.accept-float-as-int=false
# The gateway runs locally; Docker Compose publishes the simulator on port 8080.
bank.base-url=${BANK_BASE_URL:http://localhost:8080}

# Local assessment monitoring; restrict these endpoints at deployment boundaries.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=payment-gateway
management.metrics.tags.application=payment-gateway
management.metrics.distribution.percentiles-histogram.gateway.bank.requests=true
management.metrics.distribution.percentiles-histogram.gateway.payment.attempts=true
logging.pattern.level=%5p [correlationId=%X{correlationId:-none}]
